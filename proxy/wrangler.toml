# 优品 OA 同源网关：静态站点 + /proxy 反代，一个 Worker 搞定
name = "uping-oa"
main = "worker.js"
compatibility_date = "2025-03-01"

# workers.dev 在大陆不可达，仅作境外调试备用
workers_dev = true

# 静态资源：构建产物 dist/（相对本文件）
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/proxy/*"]

# 自定义域名：沿用 existing DNS（myoa 已 CNAME 到 GH Pages 且开橙云），
# 用 route 直接抢流量，无需重新签发证书
[[routes]]
pattern = "myoa.jk93.qzz.io/*"
zone_name = "jk93.qzz.io"
